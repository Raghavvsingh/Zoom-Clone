services:
  - type: web
    name: zoom-clone-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:////data/zoom_clone.db
      - key: APP_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FRONTEND_URL
        sync: false   # Set this manually in Render dashboard after Vercel deploy
    disk:
      name: zoom-db
      mountPath: /data
      sizeGB: 1
